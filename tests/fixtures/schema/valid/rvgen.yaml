schema_version: "1.1.0"
x-note: "P0 schema 自检用最小样例，不是 examples/ 下的正式参考设计"
project:
  name: uart_demo
  top: top_core
  default_clock: clk
  reset:
    name: rst_n
    polarity: active_low
    sync: true
    levels: 2
clocks:
  - name: clk
    freq_hz: 50000000
    domain_id: sys
    source: pad
modules:
  - name: uart
    kind: module
    clock: clk
    status: stable
    todo: null
    params:
      - name: WIDTH
        width: 8
        default: 8
    ports:
      - name: clk
        dir: input
        kind: clock
        width: 1
      - name: rst_n
        dir: input
        kind: reset
        width: 1
      - name: tx
        dir: output
        width: 1
      - name: rxd
        dir: input
        width: 1
      - name: cfg
        dir: input
        width: WIDTH
  - name: fifo
    kind: memory
    clock: clk
    ports:
      - name: clk
        dir: input
        kind: clock
        width: 1
      - name: push
        dir: input
        width: 8
      - name: pop
        dir: output
        width: 8
top:
  ports:
    - name: clk
      dir: input
      role: clock
    - name: rst_n
      dir: input
      role: reset
      polarity: active_low
    - name: tx
      dir: output
      from: uart.tx
    - name: rxd
      dir: input
      to:
        - uart.rxd
