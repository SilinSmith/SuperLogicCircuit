name: nightly

on:
  schedule:
    - cron: "0 18 * * *"      # 每天 UTC 18:00（北京时间 02:00）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.6"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mutmut
      - name: Mutation run
        run: mutmut run
        continue-on-error: true
      - name: Export stats
        run: mutmut export-cicd-stats
        continue-on-error: true
      - name: Enforce score (checker + digest >= 80%)
        run: python scripts/mutation_score.py --min 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutmut-stats
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: warn
